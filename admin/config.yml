backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "gallery"
    label: "Gallery Photos"
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - {label: "Title", name: "title", widget: "string", required: false, hint: "Optional - name of the piece or item"}
      - {label: "Photo", name: "image", widget: "image", required: true}
      - {label: "Description", name: "description", widget: "text", required: false, hint: "Optional - brief description, price, or details"}
      - {label: "Publish Date", name: "date", widget: "datetime", default: "{{now}}"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false, hint: "Show this item prominently"}

  - name: "settings"
    label: "Settings"
    files:
      - name: "clothing-schedule"
        label: "Clothing Appointment Schedule"
        file: "data/clothing-schedule.json"
        format: "json"
        description: "Controls the booking calendar on the Sell Clothing page. Changes go live about a minute after you click Publish."
        fields:
          - {label: "Pause ALL clothing appointments", name: "paused", widget: "boolean", default: false, required: false, hint: "Turn on to hide the calendar completely (vacation, too much inventory, etc.)"}
          - {label: "Message to show while paused", name: "paused_message", widget: "text", required: false}
          - {label: "Days I take appointments", name: "days", widget: "select", multiple: true, options: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], default: ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], hint: "Every week. Remove a day (like Saturday) to stop all appointments on that day."}
          - {label: "First appointment time", name: "start_time", widget: "select", options: ["8:00 AM", "8:30 AM", "9:00 AM", "9:30 AM", "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "1:30 PM", "2:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM", "5:00 PM", "5:30 PM", "6:00 PM", "6:30 PM", "7:00 PM", "7:30 PM", "8:00 PM"], default: "12:00 PM"}
          - {label: "Done by (closing time)", name: "end_time", widget: "select", options: ["8:00 AM", "8:30 AM", "9:00 AM", "9:30 AM", "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "1:30 PM", "2:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM", "5:00 PM", "5:30 PM", "6:00 PM", "6:30 PM", "7:00 PM", "7:30 PM", "8:00 PM"], default: "5:00 PM", hint: "The last appointment ends at this time."}
          - {label: "Appointment length", name: "slot_minutes", widget: "select", options: [{label: "15 minutes", value: "15"}, {label: "30 minutes", value: "30"}, {label: "45 minutes", value: "45"}, {label: "1 hour", value: "60"}], default: "30"}
          - {label: "How far ahead people can book (weeks)", name: "weeks_ahead", widget: "number", value_type: "int", min: 1, max: 26, default: 8}
          - label: "Days off (one-time)"
            name: "blocked_dates"
            widget: "list"
            required: false
            hint: "Add a specific date you won't be around, like this Saturday. Past dates can be deleted anytime."
            summary: "{{fields.date}} {{fields.note}}"
            fields:
              - {label: "Date", name: "date", widget: "datetime", date_format: "MM/DD/YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: true}
              - {label: "Note (only you see this)", name: "note", widget: "string", required: false}
