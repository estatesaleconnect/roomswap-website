<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Lookup — Room Swap Staff</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        body { background: var(--cream); }
        .admin-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-sm) var(--spacing-md);
            border-bottom: 3px solid var(--dark-brown);
            background: var(--off-white);
        }
        .admin-bar h1 {
            font-size: 1.5rem;
            margin: 0;
        }
        .admin-bar button {
            background: transparent;
            border: 2px solid var(--dark-brown);
            padding: 0.5rem 1rem;
            font-family: 'Crimson Text', serif;
            font-size: 1rem;
            cursor: pointer;
            color: var(--dark-brown);
        }
        .admin-wrap {
            max-width: 720px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }
        .search-row {
            display: flex;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
        }
        .search-row input {
            flex: 1;
            padding: 0.9rem 1rem;
            font-family: 'Crimson Text', serif;
            font-size: 1.2rem;
            border: 2px solid var(--dark-brown);
            background: var(--off-white);
            border-radius: 0;
            -webkit-appearance: none;
        }
        .search-row button {
            padding: 0.9rem 1.5rem;
            background: var(--green-primary);
            color: white;
            border: 2px solid var(--green-primary);
            font-family: 'Crimson Text', serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
        }
        .search-row button:hover {
            background: var(--green-dark);
            border-color: var(--green-dark);
        }
        .member-card {
            background: var(--off-white);
            border: 2px solid var(--dark-brown);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }
        .member-card h2 {
            font-size: 1.6rem;
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }
        .status-badge {
            display: inline-block;
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            padding: 0.25rem 0.75rem;
            border: 2px solid;
        }
        .status-active { color: var(--green-primary); border-color: var(--green-primary); }
        .status-past_due { color: #a45c00; border-color: #a45c00; }
        .status-canceled { color: var(--warm-gray); border-color: var(--warm-gray); }
        .status-paused { color: var(--warm-gray); border-color: var(--warm-gray); }
        .member-meta {
            color: var(--warm-gray);
            margin-bottom: var(--spacing-sm);
        }
        .perk-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs) 0;
            border-top: 1px solid rgba(62, 50, 38, 0.15);
            flex-wrap: wrap;
        }
        .perk-row .perk-label { font-weight: 700; }
        .perk-row .perk-state-available { color: var(--green-primary); font-weight: 700; }
        .perk-row .perk-state-used { color: var(--warm-gray); font-style: italic; }
        .perk-row button {
            background: var(--green-primary);
            color: white;
            border: 2px solid var(--green-primary);
            padding: 0.5rem 1rem;
            font-family: 'Crimson Text', serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        .perk-row button:disabled {
            background: var(--warm-gray);
            border-color: var(--warm-gray);
            cursor: not-allowed;
        }
        .notes-block {
            margin-top: var(--spacing-sm);
            padding-top: var(--spacing-sm);
            border-top: 1px solid rgba(62, 50, 38, 0.15);
        }
        .notes-block p { margin-bottom: 0.4rem; }
        .login-screen {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-md);
        }
        .login-screen button {
            background: var(--green-primary);
            color: white;
            border: 2px solid var(--green-primary);
            padding: 1rem 2.5rem;
            font-family: 'Crimson Text', serif;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            color: var(--warm-gray);
            font-style: italic;
            padding: var(--spacing-md);
        }
        .error-banner {
            background: #fbe9e9;
            color: #a02828;
            padding: var(--spacing-sm);
            margin-bottom: var(--spacing-sm);
            border-left: 4px solid #a02828;
        }
    </style>
</head>
<body>
    <div id="login-screen" class="login-screen" style="display:none;">
        <h1>Staff Login</h1>
        <p>Log in to look up Swap Squad members.</p>
        <button onclick="netlifyIdentity.open('login')">Log In</button>
    </div>

    <div id="app" style="display:none;">
        <div class="admin-bar">
            <h1>Member Lookup</h1>
            <button onclick="netlifyIdentity.logout()">Log Out</button>
        </div>

        <div class="admin-wrap">
            <form id="search-form" class="search-row" autocomplete="off">
                <input id="phone-input" type="tel" inputmode="numeric" placeholder="Phone number" aria-label="Phone number">
                <button type="submit">Search</button>
            </form>
            <div id="error" class="error-banner" style="display:none;"></div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app');
        const resultEl = document.getElementById('result');
        const errorEl = document.getElementById('error');

        function showApp() { loginScreen.style.display = 'none'; appScreen.style.display = 'block'; }
        function showLogin() { loginScreen.style.display = 'block'; appScreen.style.display = 'none'; }
        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = msg ? 'block' : 'none';
        }

        netlifyIdentity.on('init', user => user ? showApp() : showLogin());
        netlifyIdentity.on('login', () => { showApp(); netlifyIdentity.close(); });
        netlifyIdentity.on('logout', () => { showLogin(); resultEl.innerHTML = ''; });

        async function authHeaders() {
            const user = netlifyIdentity.currentUser();
            if (!user) return {};
            const token = await user.jwt();
            return { Authorization: `Bearer ${token}` };
        }

        function escapeHtml(s) {
            if (s === null || s === undefined) return '';
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatPhone(p) {
            const d = String(p || '').replace(/\D/g, '');
            if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
            return p || '';
        }

        function monthName(m) {
            return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1] || '';
        }

        function renderCard(m) {
            const now = new Date();
            const yyyymm = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const yyyy = String(now.getFullYear());
            const couponAvailable = m.status === 'active' && m.last_coupon_used_month !== yyyymm;
            const isBirthdayMonth = m.birthday_month === (now.getMonth() + 1);
            const birthdayCouponAvailable = m.status === 'active' && isBirthdayMonth && m.birthday_coupon_used_year !== yyyy;
            const statusClass = `status-${m.status}`;

            const interests = (m.interests || []).map(escapeHtml).join(', ');

            return `
                <div class="member-card">
                    <h2>
                        <span>${escapeHtml(m.first_name)} ${escapeHtml(m.last_name)}</span>
                        <span class="status-badge ${statusClass}">${escapeHtml((m.status || '').toUpperCase())}</span>
                    </h2>
                    <div class="member-meta">
                        ${escapeHtml(m.email)} • ${escapeHtml(formatPhone(m.phone))}<br>
                        Birthday: ${m.birthday_month ? `${escapeHtml(monthName(m.birthday_month))} ${escapeHtml(String(m.birthday_day))}` : '—'}<br>
                        ${interests ? `Interests: ${interests}` : ''}
                    </div>

                    <div class="perk-row">
                        <span class="perk-label">Monthly coupon (${yyyymm})</span>
                        <span class="${couponAvailable ? 'perk-state-available' : 'perk-state-used'}">
                            ${couponAvailable ? 'AVAILABLE' : 'USED'}
                        </span>
                        ${couponAvailable
                            ? `<button onclick="markCoupon(${m.id}, this)">Mark Used</button>`
                            : ''}
                    </div>

                    ${isBirthdayMonth ? `
                    <div class="perk-row">
                        <span class="perk-label">Birthday coupon (${yyyy})</span>
                        <span class="${birthdayCouponAvailable ? 'perk-state-available' : 'perk-state-used'}">
                            ${birthdayCouponAvailable ? 'AVAILABLE' : 'USED'}
                        </span>
                        ${birthdayCouponAvailable
                            ? `<button onclick="markBirthdayCoupon(${m.id}, this)">Mark Used</button>`
                            : ''}
                    </div>
                    ` : ''}

                    ${(m.style_notes || m.wishlist || m.top_size || m.bottom_size || m.shoe_size) ? `
                    <div class="notes-block">
                        ${m.top_size || m.bottom_size || m.shoe_size ? `
                            <p><strong>Sizes:</strong>
                                ${m.top_size ? `top ${escapeHtml(m.top_size)}` : ''}
                                ${m.bottom_size ? ` · bottom ${escapeHtml(m.bottom_size)}` : ''}
                                ${m.shoe_size ? ` · shoe ${escapeHtml(m.shoe_size)}` : ''}
                            </p>` : ''}
                        ${m.style_notes ? `<p><strong>Notes:</strong> ${escapeHtml(m.style_notes)}</p>` : ''}
                        ${m.wishlist ? `<p><strong>Wishlist:</strong> ${escapeHtml(m.wishlist)}</p>` : ''}
                    </div>
                    ` : ''}
                </div>
            `;
        }

        async function lookup(phone) {
            showError('');
            resultEl.innerHTML = '<div class="empty-state">Searching…</div>';
            try {
                const headers = await authHeaders();
                const res = await fetch(
                    `/.netlify/functions/admin-members-lookup?phone=${encodeURIComponent(phone)}`,
                    { headers }
                );
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Lookup failed');
                if (!data.members || !data.members.length) {
                    resultEl.innerHTML = '<div class="empty-state">No member found for that number.</div>';
                    return;
                }
                resultEl.innerHTML = data.members.map(renderCard).join('');
            } catch (err) {
                resultEl.innerHTML = '';
                showError(err.message);
            }
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone-input').value;
            if (phone.replace(/\D/g, '').length < 4) {
                showError('Enter at least 4 digits.');
                return;
            }
            lookup(phone);
        });

        async function markCoupon(id, btn) {
            btn.disabled = true;
            try {
                const headers = { ...(await authHeaders()), 'Content-Type': 'application/json' };
                const res = await fetch('/.netlify/functions/admin-coupon-used', {
                    method: 'POST', headers, body: JSON.stringify({ memberId: id })
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || 'Failed to mark coupon used');
                }
                lookup(document.getElementById('phone-input').value);
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
            }
        }

        async function markBirthdayCoupon(id, btn) {
            btn.disabled = true;
            try {
                const headers = { ...(await authHeaders()), 'Content-Type': 'application/json' };
                const res = await fetch('/.netlify/functions/admin-birthday-coupon-used', {
                    method: 'POST', headers, body: JSON.stringify({ memberId: id })
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || 'Failed to mark birthday coupon used');
                }
                lookup(document.getElementById('phone-input').value);
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
