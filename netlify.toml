[build]
  publish = "."
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Redirect non-.html versions to .html for clean URL handling
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 301

[[redirects]]
  from = "/sell"
  to = "/sell.html"
  status = 301

[[redirects]]
  from = "/estate-sales"
  to = "/estate-sales.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

[[redirects]]
  from = "/swap-squad"
  to = "/swap-squad.html"
  status = 301

[[redirects]]
  from = "/swap-squad/welcome"
  to = "/swap-squad-welcome.html"
  status = 301

[[redirects]]
  from = "/swap-squad/join"
  to = "/swap-squad.html"
  status = 301

# Cleaner path for the Stripe webhook
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# Proper 404 for all unmatched routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
