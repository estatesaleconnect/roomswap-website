[build]
  publish = "."
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Redirect non-.html versions to .html for clean URL handling
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 301

# Gallery retired — send old links to Contact so nothing 404s
[[redirects]]
  from = "/gallery"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/gallery.html"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/sell"
  to = "/sell.html"
  status = 301

[[redirects]]
  from = "/estate-sales"
  to = "/estate-sales.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301

# Proper 404 for all unmatched routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
